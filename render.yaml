services:
  - type: web
    name: trazabilidad-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: UPLOAD_MAX_SIZE
        value: 5242880
      - key: UPLOAD_PATH
        value: uploads
